[versions]
agp = "8.8.2"
kotlin = "2.0.0"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
fragment = "1.8.2"
recyclerview = "1.3.2"
zxing = "3.5.3"
junit = "4.13.2"
orgJson = "20240303"   # 단위테스트용 실제 org.json (android.jar 스텁 대체)
# Pleos Connect SDK (공식 문서 2026-10-26 기준)
vehicleSdk = "2.3.2"
naviHelperSdk = "3.0.5"
ttsSdk = "3.3.1"
sttSdk = "3.3.1"
fusedLocationSdk = "1.1.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
pleos-vehicle = { group = "ai.pleos.playground", name = "Vehicle", version.ref = "vehicleSdk" }
pleos-navihelper = { group = "ai.pleos.playground", name = "NaviHelper", version.ref = "naviHelperSdk" }
pleos-tts = { group = "ai.pleos.playground", name = "TextToSpeech", version.ref = "ttsSdk" }
pleos-stt = { group = "ai.pleos.playground", name = "SpeechToText", version.ref = "sttSdk" }
pleos-fusedlocation = { group = "ai.pleos.playground", name = "FusedLocation", version.ref = "fusedLocationSdk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
